name: Build & Sign SponsorBlock APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create or update a GitHub Release with the signed APK"
        type: boolean
        default: false
      release_tag:
        description: "Tag name to publish (defaults to patch_version from validation.json)"
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download pinned v0.1.9 base APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .local-build/youtube-noshorts-v019-final
          gh release download v0.1.9 \
            -p "YouTube-Adblock-v0.1.9.apk" \
            -D .local-build/youtube-noshorts-v019-final \
            --clobber

      - name: Restore signing keystore from encrypted Secrets
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "Missing SIGNING_KEYSTORE_B64 or SIGNING_PASSWORD repository secret" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.p12"
          printf '%s\n' "$SIGNING_PASSWORD" > "$RUNNER_TEMP/signing-password.txt"

      - name: Build and verify signed APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: |
          ALIAS="${SIGNING_KEY_ALIAS:-local-experiment}"
          EXTRA_ARGS=(--allow-new-signer --skip-download-copy)
          if [ -n "$SIGNING_CERT_SHA256" ]; then
            EXTRA_ARGS+=(--expected-cert-sha256 "$SIGNING_CERT_SHA256")
          fi
          python3 build_sponsorblock_update.py \
            --keystore "$RUNNER_TEMP/signing.p12" \
            --password-file "$RUNNER_TEMP/signing-password.txt" \
            --key-alias "$ALIAS" \
            "${EXTRA_ARGS[@]}"

          OUT_DIR=$(python3 -c 'import build_sponsorblock_update as m; print(m.OUTPUT_DIR)')
          OUT_APK=$(python3 -c 'import build_sponsorblock_update as m; print(m.OUTPUT_APK)')
          PATCH_VER=$(jq -r '.patch_version' "$OUT_DIR/validation.json")
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          echo "OUT_APK=$OUT_APK" >> "$GITHUB_ENV"
          echo "PATCH_VER=$PATCH_VER" >> "$GITHUB_ENV"

      - name: Wipe temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing-password.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-adblock-${{ env.PATCH_VER }}
          path: |
            ${{ env.OUT_APK }}
            ${{ env.OUT_DIR }}/SHA256SUMS.txt
            ${{ env.OUT_DIR }}/validation.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${PATCH_VER}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$OUT_APK" \
              "$OUT_DIR/SHA256SUMS.txt" \
              "$OUT_DIR/validation.json" \
              --clobber
          else
            gh release create "$TAG" \
              "$OUT_APK" \
              "$OUT_DIR/SHA256SUMS.txt" \
              "$OUT_DIR/validation.json" \
              --title "$TAG — SponsorBlock update" \
              --generate-notes
          fi
